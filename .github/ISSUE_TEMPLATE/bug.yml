name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please avoid including secrets or private information.
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board and core version
      placeholder: Arduino Uno, Arduino AVR Boards 1.8.6
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sketch and reproduction steps
      render: cpp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
