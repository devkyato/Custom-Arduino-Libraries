name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "platformio==6.1.18"
      - run: pio test -e native

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - fqbn: arduino:avr:uno
            name: uno
          - fqbn: esp32:esp32:esp32
            name: esp32dev
          - fqbn: rp2040:rp2040:rpipico
            name: pico
            platform: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
    name: compile (${{ matrix.board.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platform || '' }}
          sketch-paths: |
            - examples
          enable-warnings-report: true

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python tools/validate_metadata.py
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: ArduinoPatterns
          path: dist/ArduinoPatterns-*.zip
